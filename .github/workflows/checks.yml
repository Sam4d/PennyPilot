name: Penny Pilot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-24.04
    container: node:24-trixie-slim@sha256:7f486cabe892bff8fef04c0f7da8dba84a560be3e4e2740b7a86afc57ebec315
    env:
      CHROMIUM_DEBIAN_VERSION: 155.0.8059.79-1~deb13u1
      DEBIAN_SECURITY_SNAPSHOT: 20261021T000000Z
      PENNY_TEST_PRODUCTION: '1'
    steps:
      - name: Install the reference browser and fonts
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            fonts-dejavu-core=2.37-8 fonts-liberation=1:2.1.5-3 git ca-certificates
          # Security repositories replace old browser versions. Use the dated,
          # signed archive for the reviewed renderer instead of a moving index.
          printf '%s\n' \
            'Types: deb' \
            "URIs: https://snapshot.debian.org/archive/debian-security/${DEBIAN_SECURITY_SNAPSHOT}/" \
            'Suites: trixie-security' \
            'Components: main' \
            'Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg' \
            'Check-Valid-Until: no' \
            > /etc/apt/sources.list.d/penny-reference.sources
          apt-get -o Acquire::Retries=3 update
          apt-get install -y --no-install-recommends \
            "chromium=${CHROMIUM_DEBIAN_VERSION}" \
            "chromium-common=${CHROMIUM_DEBIAN_VERSION}"
          echo "PENNY_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          node --version
          chromium --version
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run validate:content
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:updates
      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
